            font-size: 0.7em;

        .move-staff-btn:hover { background: #2c5282; }
        .del-staff-btn {
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 3px;

<script>
    let undoStack = [];
    let currentTaskItem = null;
    let currentStaffCard = null;

    function saveState() {
        const boardHtml = document.getElementById('board').innerHTML;
        undoStack.push(boardHtml);
        if (undoStack.length > 30) undoStack.shift();
        document.getElementById('undoBtn').disabled = false;
    }

    function undoAction() {
        if (undoStack.length === 0) return;
        const previousState = undoStack.pop();
        document.getElementById('board').innerHTML = previousState;
        if (undoStack.length === 0) {
            document.getElementById('undoBtn').disabled = true;
        }
    }

    function removeItem(btn) {
        saveState();
        btn.closest('.task-item').remove();
    }

    function removeStaffCard(btn) {
        saveState();
        btn.closest('.staff-card').remove();
    }

    function removeDepartment(btn) {
        saveState();
        btn.closest('.department-row').remove();
    }

    function addTaskItem(btn) {
        saveState();
        const container = btn.previousElementSibling;
        const newItem = document.createElement('div');
        newItem.className = 'task-item';
        newItem.innerHTML = `
            <input type="text" value="새 세부업무 내용" onchange="saveState()">
            <div class="task-btns"><button class="move-btn" onclick="openMoveModal(this)">이동</button><button class="mini-del-btn" onclick="removeItem(this)">×</button></div>
        `;
        container.appendChild(newItem);
    }

    function addStaffCard(btn) {
        saveState();
        const departmentBody = btn.closest('.department-body');
        const newCard = document.createElement('div');
        newCard.className = 'staff-card';
        newCard.innerHTML = `
            <div class="staff-card-header">
                <input type="text" class="staff-title-input" value="새 담당/직위" onchange="saveState()">
                <div class="staff-card-btns">
                    <button class="move-staff-btn" onclick="openMoveStaffModal(this)">담당자 이동</button>
                    <button class="del-staff-btn" onclick="removeStaffCard(this)">×</button>
                </div>
            </div>
            <div class="task-items-container"></div>
            <button class="add-task-item-btn" onclick="addTaskItem(this)">+ 세부업무 추가</button>
        `;
        departmentBody.insertBefore(newCard, btn);
    }

    function addDepartment() {
        saveState();
        const board = document.getElementById('board');
        const newRow = document.createElement('div');
        newRow.className = 'department-row';
        newRow.innerHTML = `
            <div class="department-header">
                <div class="department-header-left"><input type="text" value="새 부서명" onchange="saveState()"></div>
                <button class="del-dept-btn" onclick="removeDepartment(this)">부서 삭제</button>
            </div>
            <div class="department-body">
                <button class="add-staff-btn" onclick="addStaffCard(this)">+ 담당자(계원) 추가</button>
            </div>
        `;
        board.appendChild(newRow);
    }

    function openMoveModal(btn) {
        currentTaskItem = btn.closest('.task-item');
        let taskText = currentTaskItem.querySelector('input').value;

        let oldModal = document.getElementById('moveModal');
        if (oldModal) oldModal.remove();

        let optionsHtml = '';
        const rows = document.querySelectorAll('.department-row');
        rows.forEach((row, rIdx) => {
            let deptName = row.querySelector('.department-header input').value;
            let staffCards = row.querySelectorAll('.staff-card');
            staffCards.forEach((card, sIdx) => {
                let staffTitle = card.querySelector('.staff-title-input').value;
                optionsHtml += `<option value="${rIdx}_${sIdx}">[${deptName}] ${staffTitle}</option>`;
            });
        });

        let modal = document.createElement('div');
        modal.id = 'moveModal';
        modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:1000;";
        modal.innerHTML = `
            <div style="background:white; padding:20px; border-radius:8px; width:350px; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
                <h3>세부업무 이동</h3>
                <p style="font-size:0.9em; color:#666;"><b>"${taskText}"</b> 항목을 보낼 곳을 선택하세요:</p>
                <select id="targetSelect" style="width:100%; padding:8px; margin-bottom:15px; border-radius:4px; border:1px solid #ccc;">
                    ${optionsHtml}
                </select>
                <div style="text-align:right;">
                    <button onclick="executeTaskMove()" style="background:#2b6cb0; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">이동</button>
                    <button onclick="document.getElementById('moveModal').remove()" style="background:#cbd5e0; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; margin-left:5px;">취소</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }

    function executeTaskMove() {
        saveState();
        let val = document.getElementById('targetSelect').value;
        let [rIdx, sIdx] = val.split('_');

        let targetRow = document.querySelectorAll('.department-row')[rIdx];
        let targetCard = targetRow.querySelectorAll('.staff-card')[sIdx];
        let targetContainer = targetCard.querySelector('.task-items-container');

        targetContainer.appendChild(currentTaskItem);
        document.getElementById('moveModal').remove();
    }

    function openMoveStaffModal(btn) {
        currentStaffCard = btn.closest('.staff-card');
        let staffTitle = currentStaffCard.querySelector('.staff-title-input').value;

        let oldModal = document.getElementById('moveStaffModal');
        if (oldModal) oldModal.remove();

        let optionsHtml = '';
        const rows = document.querySelectorAll('.department-row');
        rows.forEach((row, rIdx) => {
            let deptName = row.querySelector('.department-header input').value;
            optionsHtml += `<option value="${rIdx}">[부서] ${deptName}</option>`;
        });

        let modal = document.createElement('div');
        modal.id = 'moveStaffModal';
        modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:1000;";
        modal.innerHTML = `
            <div style="background:white; padding:20px; border-radius:8px; width:350px; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
                <h3>부서원(담당자) 이동</h3>
                <p style="font-size:0.9em; color:#666;"><b>"${staffTitle}"</b> 담당자를 통째로 보낼 부서를 선택하세요:</p>
                <select id="targetDeptSelect" style="width:100%; padding:8px; margin-bottom:15px; border-radius:4px; border:1px solid #ccc;">
                    ${optionsHtml}
                </select>
                <div style="text-align:right;">
                    <button onclick="executeStaffMove()" style="background:#2b6cb0; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">이동</button>
                    <button onclick="document.getElementById('moveStaffModal').remove()" style="background:#cbd5e0; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; margin-left:5px;">취소</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }

    function executeStaffMove() {
        saveState();
        let rIdx = document.getElementById('targetDeptSelect').value;
        let targetRow = document.querySelectorAll('.department-row')[rIdx];
        let targetBody = targetRow.querySelector('.department-body');
        let addStaffBtn = targetBody.querySelector('.add-staff-btn');

        targetBody.insertBefore(currentStaffCard, addStaffBtn);
        document.getElementById('moveStaffModal').remove();
    }

    function exportToExcel() {
        let excelData = [];
        const rows = document.querySelectorAll('.department-row');
        rows.forEach(row => {
            let deptName = row.querySelector('.department-header input').value;
            let staffCards = row.querySelectorAll('.staff-card');

            staffCards.forEach(card => {
                let staffTitle = card.querySelector('.staff-title-input').value;
                let taskInputs = card.querySelectorAll('.task-item input');

                taskInputs.forEach(taskInput => {
                    excelData.push({
                        "부서명": deptName,
                        "담당자/직위": staffTitle,
                        "세부 업무 내용": taskInput.value
                    });
                });
            });
        });

        if (excelData.length === 0) {
            alert("내보낼 업무 데이터가 없습니다.");
            return;
        }

        let worksheet = XLSX.utils.json_to_sheet(excelData);
        let workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "업무분장조정안");
        XLSX.writeFile(workbook, "김천중앙고_업무분장조정안.xlsx");
    }

    // 엑셀 파일 업로드(불러오기) 기능
    function importFromExcel(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            let data = new Uint8Array(e.target.result);
            let workbook = XLSX.read(data, {type: 'array'});
            let firstSheetName = workbook.SheetNames[0];
            let worksheet = workbook.Sheets[firstSheetName];
            let json = XLSX.utils.sheet_to_json(worksheet);

            if (json.length === 0) {
                alert("엑셀 파일에 데이터가 없습니다.");
                return;
            }

            saveState();

            // 데이터 구조화 (부서명 -> 담당자 -> 세부업무 배열)
            let deptMap = {};
            json.forEach(row => {
                let deptName = row["부서명"] || "기타부서";
                let staffTitle = row["담당자/직위"] || "담당자미정";
                let taskText = row["세부 업무 내용"] || "";

                if (!deptMap[deptName]) deptMap[deptName] = {};
                if (!deptMap[deptName][staffTitle]) deptMap[deptName][staffTitle] = [];
                if (taskText) deptMap[deptName][staffTitle].push(taskText);
            });

            // HTML 보드 재생성
            let board = document.getElementById('board');
            board.innerHTML = "";

            Object.keys(deptMap).forEach(deptName => {
                let newRow = document.createElement('div');
                newRow.className = 'department-row';
                
                let staffCardsHtml = '';
                Object.keys(deptMap[deptName]).forEach(staffTitle => {
                    let tasksHtml = '';
                    deptMap[deptName][staffTitle].forEach(taskText => {
                        tasksHtml += `
                            <div class="task-item">
                                <input type="text" value="${taskText}" onchange="saveState()">
                                <div class="task-btns"><button class="move-btn" onclick="openMoveModal(this)">이동</button><button class="mini-del-btn" onclick="removeItem(this)">×</button></div>
                            </div>
                        `;
                    });

                    staffCardsHtml += `
                        <div class="staff-card">
                            <div class="staff-card-header">
                                <input type="text" class="staff-title-input" value="${staffTitle}" onchange="saveState()">
                                <div class="staff-card-btns">
                                    <button class="move-staff-btn" onclick="openMoveStaffModal(this)">담당자 이동</button>
                                    <button class="del-staff-btn" onclick="removeStaffCard(this)">×</button>
                                </div>
                            </div>
                            <div class="task-items-container">${tasksHtml}</div>
                            <button class="add-task-item-btn" onclick="addTaskItem(this)">+ 세부업무 추가</button>
                        </div>
                    `;
                });

                newRow.innerHTML = `
                    <div class="department-header">
                        <div class="department-header-left"><input type="text" value="${deptName}" onchange="saveState()"></div>
                        <button class="del-dept-btn" onclick="removeDepartment(this)">부서 삭제</button>
                    </div>
                    <div class="department-body">
                        ${staffCardsHtml}
                        <button class="add-staff-btn" onclick="addStaffCard(this)">+ 담당자(계원) 추가</button>
                    </div>
                `;
                board.appendChild(newRow);
            });

            alert("엑셀 파일을 성공적으로 불러왔습니다!");
            event.target.value = ""; // 파일 초기화
        };
        reader.readAsArrayBuffer(file);
    }
</script>
